<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Area clienti – Logintegra</title>
    <meta name="description" content="Accedi all&rsquo;area riservata per consultare spedizioni e documenti." />
    <!-- Non indicizzare questa pagina -->
    <meta name="robots" content="noindex, nofollow" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100vh;
        border: none;
      }

      /* Messaggio mostrato se il browser blocca gli iframe (raro) */
      .fallback {
        display: none;
        padding: 40px 20px;
        text-align: center;
        color: #555;
      }
      iframe:not([src]) + .fallback {
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
    ISTRUZIONI DI INSTALLAZIONE
    ===========================
    1. Nell'editor Apps Script, copia l'URL di deployment (Gestisci deployment → copia URL /exec).
    2. Incolla quell'URL al posto di INCOLLA_QUI_URL_EXEC_DELLO_SCRIPT qui sotto,
       mantenendo il parametro ?embedded=true alla fine.
    3. Carica questo file sul tuo server web (o sito Logintegra) via HTTPS.
    4. Condividi ai clienti l'URL di QUESTO file (es. https://www.logintegra.it/area-clienti).

    Il parametro ?embedded=true elimina la barra "Questa applicazione è stata creata
    da un utente di Google Apps Script" e permette l'embedding senza conflitti
    con l'account Google del visitatore.
  -->

    <iframe
      src="https://script.google.com/macros/s/AKfycbxllfw5zh7XOIj2PhhNbLC_q460eOP35LFLiVhJqgspkjv81ak068s2QIVXNpqdW66qZQ/exec?embedded=true"
      title="Area clienti Logintegra"
      allow="downloads"
      loading="lazy"
    >
    </iframe>

    <div class="fallback">
      <p>
        Il portale non &egrave; visualizzabile in questo browser.<br />
        <a
          href="https://script.google.com/macros/s/AKfycbxllfw5zh7XOIj2PhhNbLC_q460eOP35LFLiVhJqgspkjv81ak068s2QIVXNpqdW66qZQ/exec?embedded=true"
          >Apri direttamente il portale</a
        >
      </p>
    </div>
  </body>
</html>
